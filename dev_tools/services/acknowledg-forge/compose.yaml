#
# One acknowledg-forge deployment (one forge): four containers from the same
# image, each seeing only what its role needs (see SANDBOXING.md).
#
#   service    the service (acknowledg-forge-<forge>): the forge token,
#              webhook secret, database, and clones; a client of the
#              builder and publisher servers
#   builder    a runner server (python -m edgacknowledg.forge.builder): runs
#              edg-rematerialize-test-run over pull request content
#   publisher  the publisher server (python -m edgacknowledg.forge.publisher):
#              answers reviewers via AcknowlEDG, in its pool processes; a
#              client of tools
#   tools      a runner server (python -m edgacknowledg.forge.tools): runs
#              ifc-dump and cg_annotate for the publisher
#
# Containers talk over WebSockets on networks of their own, one per pair:
# each server is reachable only by its one client (test_containers.py checks
# that), and the builder and tools runners have no other network, so no way
# out. Only the webhook port is published, and only on 127.0.0.1, for the
# host's reverse proxy.
#
# The host's systemd unit (README.md) runs it, with these variables (from
# --env-file):
#
#   FORGE            github or gitlab
#   IMAGE            the image, pinned by digest (set by deploy-remote.py)
#   FORGE_UID/GID    the host account owning STATE_DIR; every container runs
#                    as it
#   STATE_DIR        the deployment's state (home)
#   SETTINGS_FILE    the TOML settings, shared read-only by all containers
#   CREDENTIALS_DIR  the credentials systemd decrypted (the service's only)

name: acknowledg-forge

x-container: &container
  image: ${IMAGE:-ghcr.io/edgcpp/acknowledg-forge:latest}
  user: "${FORGE_UID:?}:${FORGE_GID:?}"
  # Every container is unprivileged, and stays so.
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  # Reaps what commands leave behind; the runners kill strays themselves.
  init: true
  tmpfs:
    # Bounded (sandbox.TMPFS_SIZE): it's memory.
    - /tmp:size=512m,mode=1777
  pids_limit: 512
  mem_limit: 1g

x-environment: &environment
  HOME: /tmp
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  ACKNOWLEDG_FORGE_SETTINGS_FILE: /etc/acknowledg-forge.toml

x-settings: &settings
  type: bind
  source: ${SETTINGS_FILE:?}
  target: /etc/acknowledg-forge.toml
  read_only: true
  bind: {create_host_path: false}

x-python: &python /edg/acknowledg-forge/${FORGE:-github}/bin/python

# Every container's healthcheck: a GET of its /healthz
# (edgacknowledg.forge.serving). Every server is a Quart app, and answers it
# beside its WebSocket at /, so a probe never opens a connection.
# Dependents wait until healthy, so a client's first connection finds its
# server listening. (A runner's clean-up may kill a probe; the retries
# cover it.)
x-health-probe: &health_probe |-
  import sys, urllib.request
  urllib.request.urlopen(sys.argv[1], timeout = 3).close()

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 1s

services:
  service:
    <<: *container
    command:
      - acknowledg-forge-${FORGE:-github}
      # The web app: health checks, and webhooks with webhooks = true.
      # Only on frontend (see networks). The wiring is set here, never in
      # the shared settings, so the settings can't widen a listener.
      - --service-bind=service-frontend:2728
      - --builder-service-url=ws://builder:2730
      - --publisher-service-url=ws://publisher:2731
    environment:
      <<: *environment
      CREDENTIALS_DIRECTORY: /run/credentials
    volumes:
      - *settings
      # One bind for all of the state, so builds move into reviews by
      # rename. (Missing directories are an error, not created as root.)
      - type: bind
        source: ${STATE_DIR:?}
        target: /var/lib/acknowledg-forge
        bind: {create_host_path: false}
      - type: bind
        source: ${CREDENTIALS_DIR:?}
        target: /run/credentials
        read_only: true
        bind: {create_host_path: false}
    ports:
      # Webhooks, for a reverse proxy on the host, which is what faces the
      # internet. Only ever on the loopback address: Docker's published
      # ports bypass the host's firewall (e.g. ufw), so any other address
      # would expose the service whatever the firewall says. Nothing else
      # is published.
      - 127.0.0.1:${WEBHOOK_PORT:-2728}:2728
    networks:
      # The web app binds only here (--service-bind).
      frontend:
        aliases: [service-frontend]
      build: {}
      publish: {}
    # Healthy once everything has started.
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - *python
        - -c
        - *health_probe
        - http://service-frontend:2728/healthz
    depends_on:
      builder: {condition: service_healthy}
      publisher: {condition: service_healthy}
    mem_limit: 2g

  builder:
    <<: *container
    command:
      - *python
      - -m
      # A runner server with the builder role (runner.roles: what it
      # allows, as without containers).
      - edgacknowledg.forge.builder
      # Its only network is the one it shares with its client.
      - --host=0.0.0.0
      - --port=2730
      - --container
    environment:
      <<: *environment
    volumes:
      - *settings
      - type: bind
        source: ${STATE_DIR:?}/reviews
        target: /var/lib/acknowledg-forge/reviews
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:?}/build-staging
        target: /var/lib/acknowledg-forge/build-staging
        bind: {create_host_path: false}
    networks: [build]
    healthcheck:
      <<: *healthcheck
      test: [CMD, *python, -c, *health_probe, "http://127.0.0.1:2730/healthz"]
    mem_limit: 2g

  publisher:
    <<: *container
    command:
      - *python
      - -m
      - edgacknowledg.forge.publisher
      # Only on the network it shares with the service (not, say, the tools
      # runner's).
      - --host=publisher-publish
      - --port=2731
      - --tools-service-url=ws://tools:2732
    environment:
      <<: *environment
    volumes:
      - *settings
      - type: bind
        source: ${STATE_DIR:?}/reviews
        target: /var/lib/acknowledg-forge/reviews
        read_only: true
        bind: {create_host_path: false}
    networks:
      publish:
        aliases: [publisher-publish]
      tools: {}
      egress: {}
    # Listening only once its pool has started.
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - *python
        - -c
        - *health_probe
        - http://publisher-publish:2731/healthz
    depends_on:
      tools: {condition: service_healthy}
    # The server and its pool processes.
    mem_limit: 2g

  tools:
    <<: *container
    command:
      - *python
      - -m
      # A runner server with the tools role.
      - edgacknowledg.forge.tools
      # Its only network is the one it shares with its client.
      - --host=0.0.0.0
      - --port=2732
      - --container
    environment:
      <<: *environment
    volumes:
      - *settings
      - type: bind
        source: ${STATE_DIR:?}/reviews
        target: /var/lib/acknowledg-forge/reviews
        read_only: true
        bind: {create_host_path: false}
    networks: [tools]
    healthcheck:
      <<: *healthcheck
      test: [CMD, *python, -c, *health_probe, "http://127.0.0.1:2732/healthz"]

networks:
  # The service's: the forge, and webhooks from the host.
  frontend: {}
  # The publisher server's: AcknowlEDG.
  egress: {}
  # One per pair; internal networks have no route out.
  build:
    internal: true
  publish:
    internal: true
  tools:
    internal: true
