#
# Check the pending Changes entries (*/pending_changes/*.txt) with
# `edg-collect-changes --check` (format, spelling, typos, line length), so a
# bad entry is caught before the nightly collect-changes job meets it.  This
# checks the entries, not the tools; their unit tests are dev-tools-tests.yml.
# The tool paths below are triggers only so that a change to the checks is
# tried against the entries already pending.

name: Pending Changes Entries

on:
  push:
    branches:
      - main
    paths:
      - '**/pending_changes/**'
      - .github/workflows/changes-fragments.yml
      - dev_tools/bin/edg-check-file-changes
      - dev_tools/bin/edg-collect-changes
      - dev_tools/pylibs/edgchanges/**
      - dev_tools/pylibs/edgutil/**
  pull_request:
    paths:
      - '**/pending_changes/**'
      - .github/workflows/changes-fragments.yml
      - dev_tools/bin/edg-check-file-changes
      - dev_tools/bin/edg-collect-changes
      - dev_tools/pylibs/edgchanges/**
      - dev_tools/pylibs/edgutil/**

permissions:
  contents: read

jobs:
  check:
    name: check-pending-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/dev_tools/pylibs
      # Each holds a Changes file and its pending_changes/ directory (keep in
      # step with the list in collect-changes.yml).
      CHANGES_DIRS: src util lib_src include_c++ nt_util
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same dictionary as the dev-env image
      # (dev_tools/docker/dev-env/setup-scripts/install-software.sh).
      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: Check pending Changes entries
        run: |
          status=0
          for dir in ${CHANGES_DIRS}; do
            dev_tools/bin/edg-collect-changes --check \
              "${dir}/Changes" "${dir}/pending_changes" || status=1
          done
          exit "${status}"
