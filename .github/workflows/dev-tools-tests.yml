#
# Run the unit tests of the dev_tools (dev_tools/tests).  Checking the pending
# Changes entries themselves is changes-fragments.yml.

name: Dev Tools Tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dev-tools-tests.yml
      - dev_tools/bin/edg-check-commit-messages
      - dev_tools/bin/edg-check-file-changes
      - dev_tools/bin/edg-collect-changes
      - dev_tools/pylibs/edgchanges/**
      - dev_tools/pylibs/edgutil/**
      - dev_tools/tests/**
  pull_request:
    paths:
      - .github/workflows/dev-tools-tests.yml
      - dev_tools/bin/edg-check-commit-messages
      - dev_tools/bin/edg-check-file-changes
      - dev_tools/bin/edg-collect-changes
      - dev_tools/pylibs/edgchanges/**
      - dev_tools/pylibs/edgutil/**
      - dev_tools/tests/**
  merge_group:

permissions:
  contents: read

jobs:
  unit-tests:
    name: dev-tools-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/dev_tools/pylibs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same dictionary as the dev-env image
      # (dev_tools/docker/dev-env/setup-scripts/install-software.sh).
      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: Run unit tests
        run: python3 -m unittest discover -s dev_tools/tests -v
