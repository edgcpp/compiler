#
# Configure and build the standard release and debug presets on GitHub-hosted
# runners. Linux GCC/Clang builds treat CPFE warnings as errors.

name: Strict Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-msvc-release:
    name: Windows MSVC release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Ninja
        run: choco install ninja -y

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build SoftFloat
        uses: ./.github/actions/build-softfloat-msvc

      - name: Configure windows-msvc-release
        env:
          EDG_SOFTFLOAT_INCLUDE_PATH: ${{ github.workspace }}/softfloat/include
          EDG_SOFTFLOAT_LIB_PATH: ${{ github.workspace }}/softfloat/lib/softfloat.lib
        run: cmake --preset windows-msvc-release

      - name: Build windows-msvc-release
        env:
          EDG_SOFTFLOAT_INCLUDE_PATH: ${{ github.workspace }}/softfloat/include
          EDG_SOFTFLOAT_LIB_PATH: ${{ github.workspace }}/softfloat/lib/softfloat.lib
        run: cmake --build build/msvc-release

  linux-gcc-release:
    name: Linux GCC release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/edgcpp/ci-runner:latest
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure linux-gcc-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: >
          cmake --preset linux-gcc-release
          -DEDG_CPFE_WARNINGS_ARE_ERRORS=true

      - name: Build linux-gcc-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --build build/gcc-release

  linux-gcc-debug:
    name: Linux GCC debug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/edgcpp/ci-runner:latest
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure linux-gcc-debug
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: >
          cmake --preset linux-gcc-debug
          -DEDG_CPFE_WARNINGS_ARE_ERRORS=true

      - name: Build linux-gcc-debug
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --build build/gcc

  linux-clang-release:
    name: Linux Clang release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/edgcpp/ci-runner:latest
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure linux-clang-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: >
          cmake --preset linux-clang-release
          -DEDG_CPFE_WARNINGS_ARE_ERRORS=true

      - name: Build linux-clang-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --build build/clang-release

  linux-clang-debug:
    name: Linux Clang debug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: docker.io/edgcpp/ci-runner:latest
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure linux-clang-debug
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: >
          cmake --preset linux-clang-debug
          -DEDG_CPFE_WARNINGS_ARE_ERRORS=true

      - name: Build linux-clang-debug
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --build build/clang

