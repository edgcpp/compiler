#
# Build the Sphinx documentation in doc/ with warnings treated as errors, so
# documentation changes stay publishable.
#
# The documentation is published by the edgcpp/edgcpp.github.io site
# workflow, not from here: it builds the release tag into
# https://edgcpp.org/doc/ and main into https://edgcpp.org/dev/doc/.  After a
# push to main passes the build, this asks that workflow to run so the
# development documentation is updated.  That needs the SITE_DISPATCH_TOKEN
# secret: a fine-grained token for edgcpp/edgcpp.github.io only, with
# "Actions: Read and write" permission.

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx
        run: python -m pip install -r doc/requirements.txt

      # The published site uses the dirhtml builder, so check that one.
      - name: Build HTML
        run: make -C doc dirhtml SPHINXOPTS="-W"

  publish-dev:
    name: Publish development documentation
    needs: build
    if: >
      github.repository == 'edgcpp/compiler' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the edgcpp.org site build
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set, so" \
              "https://edgcpp.org/dev/doc/ was not updated."
            exit 0
          fi
          gh workflow run build_and_deploy.yml \
            --repo edgcpp/edgcpp.github.io --ref develop
