#
# Build the Sphinx documentation in doc/ with warnings treated as errors.
# Pushes to main in edgcpp/compiler also publish the HTML to GitHub Pages,
# which serves it at https://edgcpp.org/compiler/ (the org site's custom
# domain applies to every project site in the edgcpp org).
#
# This requires the repository's Pages source to be set to "GitHub Actions"
# (Settings > Pages > Build and deployment > Source).

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supersede queued runs for the same ref, but let an in-progress deployment
# to Pages finish rather than cancelling it partway through.
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install Sphinx
        run: python -m pip install -r doc/requirements.txt

      - name: Build HTML
        run: make -C doc html SPHINXOPTS="-W --keep-going"

      - name: Upload Pages artifact
        if: >
          github.repository == 'edgcpp/compiler' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >
      github.repository == 'edgcpp/compiler' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
