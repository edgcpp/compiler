#
# Runs the equivalent configure -> build -> test sequence as:
#
#   edg-docker-test --posture=extensive --non-interactive
#
# inside the ghcr.io/edgcpp/ci-runner image. Each toolchain runs
# ci-toolchain.yml, which builds its preset and then runs one test leg per
# configuration; a test leg waits only on its own toolchain's build:
#
#   prepare ─┬─► linux-gcc-debug:      build ─► Test ×2 ─┬─► publish (on failure)
#            └─► linux-i686-gcc-debug: build ─► Test ×2 ─┴─► coverage
#   bench (pull requests only; independent)
#
# The prepare job computes the shared run timestamp and test-input hash that
# the toolchains take as inputs. Test legs report as "<preset> / Test
# <config>" (e.g., "linux-gcc-debug / Test edg_x86_64").
#
# A shared run timestamp keeps results under the same tests/runs/<timestamp>/
# tree; the publish job republishes failure artifacts from all test legs.
#
# The builds set EDG_BUILD_IDENTIFIER so that identical sources produce
# byte-identical build products. Each test leg keys a cache entry on the
# SHA-256 of the build products it downloaded, the test files its
# configuration can read (edg-test-inputs-hash, so re-recording a test for
# one configuration doesn't invalidate the others), and the git trees of the
# other inputs it reads from the checkout (bases/, include_c++/,
# util/eccp.sh, and the workflow files, computed once by the prepare job).
# When a leg passes, it saves that entry along with its coverage report; a
# later run on the same ref (a re-run, or a push that leaves the build
# products and test inputs unchanged) restores it, skips edgy, and reuses
# the coverage report.
# actions/cache scopes entries to the ref that saved them (plus the default
# branch), so one pull request can never vouch for another's build.
#
# The bench job runs the cachegrind benchmarks the way
# `edg-docker-bench --posture=release` does and uploads them as bench-results
# (c/ and cpp/ runs, for comparison against the checked-in
# benchmarks/baselines/project/release-{c,cpp}).
#
# The debug builds are instrumented for gcov (EDG_CPFE_USE_GCOV) and ship
# their .gcno files with the build products. Each test leg turns the .gcda
# files its run produces into a gcovr JSON report for src/; the coverage job
# merges the reports of all test legs and uploads one report to Codecov
# (see .github/codecov.yml). The coverage steps never fail the run; only
# edgy's results do.

name: Build & Test CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  GCOVR_VERSION: '8.7'

jobs:
  prepare:
    name: Prepare run timestamp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_timestamp: ${{ steps.timestamp.outputs.run_timestamp }}
      test_inputs: ${{ steps.test-inputs.outputs.test_inputs }}
    steps:
      - name: Declare shared edgy run timestamp
        id: timestamp
        run: |
          # Match edgutil.RUN_TIMESTAMP_FORMAT (%Y.%m.%d-%H.%M.%S).
          echo "run_timestamp=$(date -u +'%Y.%m.%d-%H.%M.%S')" >> "${GITHUB_OUTPUT}"

      # Only the git trees are needed, so skip blobs and most of the
      # working tree.
      - name: Check out repository metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github

      - name: Hash test inputs
        id: test-inputs
        run: |
          # What the test legs read from the checkout, other than the build
          # products and tests/ (which each leg hashes per configuration):
          # EDG_BASE (whose include/ is include_c++/) and eccp. The workflow
          # files cover the container image and the edgy options; edgy and
          # the other tools come from that image, not from dev_tools/.
          hash="$(git rev-parse HEAD:bases HEAD:include_c++ \
                    HEAD:util/eccp.sh \
                    HEAD:.github/workflows/build-and-test-ci.yml \
                    HEAD:.github/workflows/ci-toolchain.yml |
                  sha256sum | cut -c1-64)"
          echo "test_inputs=${hash}" >> "${GITHUB_OUTPUT}"

  # Each toolchain builds its preset and then tests each of its
  # configurations (see ci-toolchain.yml), so its test legs wait only on its
  # own build. The legs report as "<preset> / Test <config>".
  toolchain:
    name: ${{ matrix.preset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-debug
            build_dir: build/gcc
            base: gcc
            configs: '["edg_x86_64", "edg_x86_64_cp"]'
          - preset: linux-i686-gcc-debug
            build_dir: build/gcc-i686
            base: gcc-i686
            configs: '["edg_x86_32", "edg_x86_32_cp"]'
    uses: ./.github/workflows/ci-toolchain.yml
    with:
      preset: ${{ matrix.preset }}
      build_dir: ${{ matrix.build_dir }}
      base: ${{ matrix.base }}
      configs: ${{ matrix.configs }}
      run_timestamp: ${{ needs.prepare.outputs.run_timestamp }}
      test_inputs: ${{ needs.prepare.outputs.test_inputs }}

  publish-test-results:
    name: Publish aggregated test results
    needs:
      - prepare
      - toolchain
    # Republish whenever any test leg failed (partial artifacts may exist).
    if: ${{ always() && needs.toolchain.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download partial test-result artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: aggregated-test-results
          merge-multiple: true

      # Record which commit was tested so consumers of the artifact (e.g.
      # acknowledg-forge) can check out the matching tree. For pull requests
      # this is the merge commit, not the PR head.
      - name: Record CI metadata
        env:
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - > aggregated-test-results/ci-meta.json <<'EOF'
          import json, os
          print(json.dumps({
            'tested_sha': os.environ['TESTED_SHA'],
            'head_sha': os.environ['HEAD_SHA'],
            'run_id': int(os.environ['RUN_ID']),
            'run_attempt': int(os.environ['RUN_ATTEMPT']),
          }, indent = 2))
          EOF

      - name: Upload elist, elog, and .rt.tar.gz results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-all
          path: aggregated-test-results/
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Publish coverage to Codecov
    needs: toolchain
    # Like publish-test-results, merge whatever the test legs produced,
    # whether or not their tests passed. The number of configs is not
    # fixed: every coverage-* artifact is merged into one report and
    # uploaded once.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download per-config coverage reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Install gcovr
        continue-on-error: true
        run: |
          python3 -m venv "${RUNNER_TEMP}/gcovr"
          "${RUNNER_TEMP}/gcovr/bin/pip" install --quiet \
            "gcovr==${GCOVR_VERSION}"

      - name: Merge coverage reports
        if: ${{ hashFiles('coverage/*.json') != '' }}
        continue-on-error: true
        run: |
          ls -l coverage
          "${RUNNER_TEMP}/gcovr/bin/gcovr" \
            --root . \
            --merge-mode-functions=separate \
            --json-add-tracefile 'coverage/*.json' \
            --cobertura coverage.xml \
            --print-summary

      # Pull requests from forks have no access to secrets; the Codecov
      # action then falls back to a tokenless upload, which Codecov accepts
      # for public repositories.
      #
      # The report is complete as generated by gcovr, so skip the CLI's own
      # gcov run (plugins: noop) and its "file fixes" pass, which opens every
      # file git tracks and crashes on the dangling symlinks used as test
      # inputs (e.g. tests/.../embed___has_embed/embed___has_embed.c).
      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage.xml') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          disable_file_fixes: true
          network_filter: src/
          plugins: noop
          fail_ci_if_error: true
          verbose: true

  bench:
    name: Benchmark linux-gcc-release
    if: ${{ github.event_name == 'pull_request' }}
    # Benchmark infrastructure problems shouldn't fail a pull request's CI.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:da140ca90c420977f187279d7939fe0c7cb3c4b656e5ab2dc0f6b9ac2a43a255
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure linux-gcc-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --preset linux-gcc-release

      - name: Build linux-gcc-release
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
        run: cmake --build build/gcc-release --target cpfe cpfe-cp

      - name: Run benchmarks
        env:
          EDG_BASE: ${{ github.workspace }}/bases/docker/dev-env/gcc
          EDG_BENCH_RUNS_KEPT: '0'
        run: |
          # Use the pull request's own benchmark tooling.
          export PATH="${GITHUB_WORKSPACE}/dev_tools/bin:${PATH}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/dev_tools/pylibs"
          mkdir -p bench-results
          for run in c:bin/cpfe cpp:bin/cpfe-cp; do
            name="${run%%:*}"
            binary="${run#*:}"
            (cd build/gcc-release && source environment.sh &&
             edg-bench "${binary}")
            latest="$(ls -1d benchmarks/runs/*/ | sort | tail -n 1)"
            mv "${latest}" "bench-results/${name}"
          done

      - name: Record CI metadata
        env:
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - > bench-results/ci-meta.json <<'EOF'
          import json, os
          print(json.dumps({
            'tested_sha': os.environ['TESTED_SHA'],
            'head_sha': os.environ['HEAD_SHA'],
            'run_id': int(os.environ['RUN_ID']),
            'run_attempt': int(os.environ['RUN_ATTEMPT']),
          }, indent = 2))
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: error
          retention-days: 14
