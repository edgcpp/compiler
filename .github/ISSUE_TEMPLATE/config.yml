# The issue template chooser. Collaborators may still open a blank issue (e.g.
# for a task or feature); everyone else can report problems through the
# Discussions triage categories.
blank_issues_enabled: true
contact_links:
  - name: Compilation issue triage (Discussions)
    url: https://github.com/edgcpp/compiler/discussions/categories/issue-triage-compilation
    about: Report a compilation problem for triage if you can't file issues directly.
  - name: General issue triage (Discussions)
    url: https://github.com/edgcpp/compiler/discussions/categories/issue-triage-general
    about: Report any other problem for triage if you can't file issues directly.
  - name: Questions (Discussions)
    url: https://github.com/edgcpp/compiler/discussions/categories/q-a
    about: Ask questions about using or contributing to the project.
